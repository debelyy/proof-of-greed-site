name: data

# «Бэкенд без сервера»: раз в час сканируем новые блоки vault + пулы playmog,
# коммитим JSON в репозиторий — статический сайт на Pages читает их рядом с собой.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: scan chain + playmog pools
        run: node scripts/build-data.mjs
      - name: commit data
        run: |
          git config user.name "mog-data-bot"
          git config user.email "mog-data-bot@users.noreply.github.com"
          cp greed.html index.html
          git add data index.html
          git diff --cached --quiet && echo "no data changes" || { git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"; git push; }
