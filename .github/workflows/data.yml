name: data

# «Бэкенд без сервера»: по крону каждые 10 минут сканируем новые блоки vault + пулы
# playmog, коммитим JSON в репозиторий — статический сайт на Pages читает их рядом с собой.
# NB: GitHub троттлит schedule — фактическая частота ~4-6 обновлений/день; свежесть данных
# честно показана таймстампами на самом сайте.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: server ledger (SIWE fan account)
        run: |
          pip install --quiet eth-account
          python scripts/fetch-server.py   # POG_SIWE_KEY from repo secrets; skips silently if unset
        env:
          POG_SIWE_KEY: ${{ secrets.POG_SIWE_KEY }}
      - name: scan chain + playmog pools
        run: node scripts/build-data.mjs
      - name: commit data
        run: |
          git config user.name "mog-data-bot"
          git config user.email "mog-data-bot@users.noreply.github.com"
          cp greed.html index.html
          git add data index.html
          git diff --cached --quiet && echo "no data changes" || { git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"; git pull --rebase
          git push; }
